services:
  - type: web
    name: ackvia
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: formrelay-db
          property: connectionString
  - type: worker
    name: ackvia-delivery-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: uv run python -m app.workers.delivery
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: formrelay-db
          property: connectionString
databases:
  - name: formrelay-db
    plan: free
    databaseName: formrelay
    user: postgres